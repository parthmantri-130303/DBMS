<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login — CampusKhoj Admin Portal</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    body {
      background-color: var(--bg-admin);
      color: var(--text-admin);
    }
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2.25rem;
      background: var(--surface-admin);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-admin);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.375rem;
      color: var(--text-admin);
    }
    .form-input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border-admin);
      border-radius: var(--radius-md);
      font-size: 1rem;
      background: #181E1A;
      color: var(--text-admin);
      transition: border-color 150ms ease;
    }
    .form-input:focus {
      border-color: var(--primary-admin);
    }
  </style>
</head>
<body class="admin-theme">
  <div class="login-container">
    <div class="login-card animate-fade-in">
      <div style="text-align: center; margin-bottom: 1.75rem;">
        <div style="font-family: var(--font-heading); font-size: 1.625rem; color: #FFF; display:flex; align-items:center; justify-content:center; gap:0.5rem;">
          <span style="display:inline-block;width:12px;height:12px;background:var(--accent);border-radius:50%;"></span>
          CampusKhoj Desk
        </div>
        <p style="margin: 0.25rem 0 0 0; color: var(--muted-admin); font-size: 0.875rem;">
          Security &amp; Administrative Control Center
        </p>
      </div>

      <form id="admin-login-form">
        <div class="form-group">
          <label for="username" class="form-label">Staff Username</label>
          <input
            type="text"
            id="username"
            class="form-input"
            placeholder="e.g. admin, security_kon"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="Enter password"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="submit-btn" class="btn-saffron" style="width: 100%; margin-top: 1rem;">
          Sign In to Admin Portal
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.8125rem; color: var(--muted-admin);">
        Student looking for lost items? <a href="../student-portal/login.html" style="color: var(--accent); font-weight: 600;">Student Portal &rarr;</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { ApiClient } from '../shared/api.js';
    import { showToast } from '../shared/ui.js';

    const api = new ApiClient('admin');

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying staff credentials...';

      try {
        const res = await api.login(username, password);
        if (res.must_change_password) {
          showToast('Temporary password detected. You must change your password.', 'info');
          setTimeout(() => {
            window.location.href = 'change-password.html';
          }, 500);
          return;
        }
        showToast(`Welcome, ${res.user.name || username}!`, 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
      } catch (err) {
        showToast(err.message || 'Staff login failed. Please verify credentials.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Admin Portal';
      }
    });
  </script>
</body>
</html>
