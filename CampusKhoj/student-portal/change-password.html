<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — CampusKhoj</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <style>
    .change-pwd-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card-box {
      width: 100%;
      max-width: 440px;
      padding: 2.25rem;
      background: var(--surface-student);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-student);
      box-shadow: var(--shadow-md);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.375rem;
    }
    .form-input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border-student);
      border-radius: var(--radius-md);
      font-size: 1rem;
    }
    .form-input:focus {
      border-color: var(--primary-student);
    }
    .rules-list {
      list-style: none;
      padding: 0;
      margin: 0.75rem 0 1.25rem 0;
      font-size: 0.8125rem;
      color: var(--muted-student);
    }
    .rule-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.375rem;
      transition: color 150ms ease;
    }
    .rule-icon {
      font-weight: bold;
      width: 16px;
      display: inline-block;
    }
    .strength-meter {
      height: 4px;
      background: #E8E2D8;
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
    }
    .strength-bar {
      height: 100%;
      width: 0%;
      transition: width 200ms ease, background-color 200ms ease;
    }
  </style>
</head>
<body>
  <div class="change-pwd-container">
    <div class="card-box animate-fade-in">
      <h2 style="margin: 0 0 0.5rem 0; color: var(--primary-student);">Set Your Password</h2>
      <p style="margin: 0 0 1.5rem 0; color: var(--muted-student); font-size: 0.875rem;">
        Your PRN was your temporary password. To protect your account, choose a new password before accessing the portal.
      </p>

      <form id="pwd-form">
        <div class="form-group">
          <label for="current-pwd" class="form-label">Current Password (Your PRN)</label>
          <input
            type="password"
            id="current-pwd"
            class="form-input"
            placeholder="Enter your PRN"
            required
            autocomplete="current-password"
          >
        </div>

        <div class="form-group">
          <label for="new-pwd" class="form-label">New Password</label>
          <input
            type="password"
            id="new-pwd"
            class="form-input"
            placeholder="Enter secure password"
            required
            autocomplete="new-password"
          >
          <div class="strength-meter">
            <div id="strength-bar" class="strength-bar"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-pwd" class="form-label">Confirm New Password</label>
          <input
            type="password"
            id="confirm-pwd"
            class="form-input"
            placeholder="Re-enter new password"
            required
            autocomplete="new-password"
          >
        </div>

        <ul class="rules-list" id="pwd-rules">
          <li class="rule-item" data-rule="length">
            <span class="rule-icon">&#8226;</span> At least 8 characters
          </li>
          <li class="rule-item" data-rule="prn">
            <span class="rule-icon">&#8226;</span> Does not equal or contain your PRN
          </li>
          <li class="rule-item" data-rule="common">
            <span class="rule-icon">&#8226;</span> Not a common or easily guessed password
          </li>
          <li class="rule-item" data-rule="match">
            <span class="rule-icon">&#8226;</span> Both passwords match
          </li>
        </ul>

        <button type="submit" id="save-btn" class="btn-saffron" style="width: 100%;" disabled>
          Update Password &amp; Continue
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { ApiClient } from '../shared/api.js';
    import { showToast } from '../shared/ui.js';

    const api = new ApiClient('student');
    const user = api.getUser();

    if (!api.isAuthenticated()) {
      window.location.href = 'login.html';
    }

    const currentPwdInput = document.getElementById('current-pwd');
    const newPwdInput = document.getElementById('new-pwd');
    const confirmPwdInput = document.getElementById('confirm-pwd');
    const saveBtn = document.getElementById('save-btn');
    const strengthBar = document.getElementById('strength-bar');

    const prn = user?.prn || '';
    if (prn) {
      newPwdInput.setAttribute('data-prn', prn);
    }

    const commonPasswords = ['password', '12345678', 'admin123', 'qwerty123'];

    function validateState() {
      const val = newPwdInput.value;
      const conf = confirmPwdInput.value;

      const ruleLength = val.length >= 8;
      const rulePrn = prn ? (val !== prn && !val.includes(prn) && val.length > 0) : val.length > 0;
      const ruleCommon = !commonPasswords.includes(val.toLowerCase()) && val.length >= 8;
      const ruleMatch = val.length > 0 && val === conf;

      updateRuleUI('length', ruleLength);
      updateRuleUI('prn', rulePrn);
      updateRuleUI('common', ruleCommon);
      updateRuleUI('match', ruleMatch);

      // Strength calculation
      let score = 0;
      if (ruleLength) score += 25;
      if (rulePrn) score += 25;
      if (ruleCommon) score += 25;
      if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score += 25;

      strengthBar.style.width = `${score}%`;
      if (score < 50) strengthBar.style.backgroundColor = 'var(--lost)';
      else if (score < 100) strengthBar.style.backgroundColor = 'var(--accent)';
      else strengthBar.style.backgroundColor = 'var(--success)';

      const allValid = ruleLength && rulePrn && ruleCommon && ruleMatch && currentPwdInput.value.length > 0;
      saveBtn.disabled = !allValid;
    }

    function updateRuleUI(ruleName, isValid) {
      const item = document.querySelector(`[data-rule="${ruleName}"]`);
      if (!item) return;
      const icon = item.querySelector('.rule-icon');
      if (isValid) {
        item.style.color = 'var(--success)';
        icon.innerHTML = '&#10003;';
      } else {
        item.style.color = 'var(--muted-student)';
        icon.innerHTML = '&#8226;';
      }
    }

    currentPwdInput.addEventListener('input', validateState);
    newPwdInput.addEventListener('input', validateState);
    confirmPwdInput.addEventListener('input', validateState);

    document.getElementById('pwd-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        await api.changePassword(currentPwdInput.value, newPwdInput.value);
        showToast('Password updated successfully!', 'success');

        // Check if profile is complete
        setTimeout(() => {
          if (!user?.profile_completed) {
            window.location.href = 'profile-setup.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 600);
      } catch (err) {
        showToast(err.message || 'Failed to update password', 'error');
        saveBtn.disabled = false;
        saveBtn.textContent = 'Update Password & Continue';
      }
    });
  </script>
</body>
</html>
